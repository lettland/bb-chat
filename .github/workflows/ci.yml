name: ci

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

# A force-push should cancel the run it superseded; a push to the default branch
# should not cancel a run that may become a release baseline.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: typecheck · lint · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun test

  scripts:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The install/build scripts are the first thing a new user runs; a quoting
      # bug there fails on their machine, never in the test suite.
      - run: shellcheck scripts/*.sh

  # All four release platforms, self-checked, uploaded as run artifacts — the
  # same binaries a release would attach, downloadable from every run.
  build:
    name: build
    uses: ./.github/workflows/build.yml
