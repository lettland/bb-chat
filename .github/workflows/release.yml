name: release

on:
  push:
    tags: ["v*"]

# A release is never worth racing against itself.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Publishing a tag whose version disagrees with package.json produces a release
  # nobody can reproduce. Fail before anything is built or uploaded.
  verify:
    name: verify tag matches package.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Compare tag to package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(bun --print 'require("./package.json").version')"
          echo "tag=$tag package.json=$pkg"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$tag does not match package.json version $pkg"
            exit 1
          fi
      - run: bun install --frozen-lockfile
      # The same gate as CI. A tag can be pushed to a commit CI never ran on.
      - run: bun run check

  binaries:
    name: ${{ matrix.artifact }}
    needs: verify
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: bbchat-linux-x64
          - os: ubuntu-24.04-arm
            artifact: bbchat-linux-arm64
          # Intel macOS. GitHub retired the macos-13 runner; macos-15-intel is
          # the current x64 image, and it is what produces a darwin-x64 binary —
          # macos-latest is arm64 and would silently mislabel the artifact.
          - os: macos-15-intel
            artifact: bbchat-darwin-x64
          - os: macos-latest
            artifact: bbchat-darwin-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun build ./src/index.ts --compile --outfile "dist/${{ matrix.artifact }}"
      # Never publish a binary whose embedded grammars fail to highlight offline.
      - run: "./dist/${{ matrix.artifact }} selfcheck"
      - name: Checksum
        run: |
          cd dist
          shasum -a 256 "${{ matrix.artifact }}" > "${{ matrix.artifact }}.sha256"
          cat "${{ matrix.artifact }}.sha256"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/${{ matrix.artifact }}
            dist/${{ matrix.artifact }}.sha256
          # Without this, a missing binary or checksum uploads nothing and still
          # reports success — and the npm job, which only gates on job status,
          # would publish alongside an incomplete release.
          fail_on_unmatched_files: true
          generate_release_notes: true

  npm:
    name: publish to npm
    # Only publish once every platform binary built and self-checked. A broken
    # binary and a good npm package is the worst of both worlds.
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance attestation
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      # Publishes the source + bin wrapper, which run under Bun. Requires the
      # NPM_TOKEN secret; --provenance signs an attestation of where the build
      # came from.
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
