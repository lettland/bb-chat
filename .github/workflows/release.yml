name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  binaries:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: vch-linux-x64
          - os: ubuntu-24.04-arm
            artifact: vch-linux-arm64
          - os: macos-13
            artifact: vch-darwin-x64
          - os: macos-latest
            artifact: vch-darwin-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun build ./src/index.ts --compile --outfile "dist/${{ matrix.artifact }}"
      # Never publish a binary whose embedded grammars fail to highlight offline.
      - run: "./dist/${{ matrix.artifact }} selfcheck"
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.artifact }}

  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - run: bun run typecheck && bun run lint && bun test
      # Publishes the source + bin wrapper (run under Bun). Requires NPM_TOKEN.
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
