# JavaScript dependency updates are intentionally absent. Neither ecosystem
# works for this repo: `npm` updates package.json but not bun.lock, so CI's
# `bun install --frozen-lockfile` rejects every PR, and `bun` cannot read the
# lockfileVersion 2 that Bun 1.4.2 writes
# (https://github.com/dependabot/dependabot-core/issues/6528). Neither offers
# security updates for Bun projects either way, so dependencies are reviewed
# with `bun outdated` until that changes.
version: 2
updates:
  # Actions have no lockfile, so these PRs are mergeable as opened.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - ci
